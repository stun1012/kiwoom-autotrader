services:
  - type: web
    name: kiwoom-autotrader
    runtime: node
    plan: free
    buildCommand: node --test engine.test.mjs web-security.test.mjs
    startCommand: node server.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: KIWOOM_ENV
        value: mock
