<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · 주식 자동매매</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c111b;color:#e9eff9;font:15px/1.7 system-ui,'Malgun Gothic',sans-serif;padding:24px}main{width:100%;max-width:430px;padding:32px;background:#151d2a;border:1px solid #283345;border-radius:16px}small{color:#65e3b1;letter-spacing:2px}h1{font-size:25px;margin:12px 0}p{color:#93a4bc}label{display:block;margin-top:24px}input,button{width:100%;padding:13px;border-radius:8px;font:inherit;margin-top:10px}input{border:1px solid #35445b;background:#0e1623;color:#fff}button{border:0;background:#65e3b1;color:#0b241b;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#error{color:#ff8790;min-height:26px}.note{font-size:12px}</style></head><body><main><small>KIWOOM / STRATEGY LAB</small><h1>자동매매 대시보드</h1><p>관리자 비밀번호로 로그인하세요.</p><form id="login"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required autofocus maxlength="1024"><button id="submit">로그인</button><p id="error" role="alert"></p></form><p class="note">현재 버전은 가상 자금으로만 거래합니다.<br>로그아웃해도 서버가 실행 중이면 모의매매는 계속됩니다.</p></main><script>
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.replace('/')}catch(e){document.getElementById('error').textContent=e.message}finally{b.disabled=false}};
</script></body></html>
